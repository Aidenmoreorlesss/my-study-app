<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Sets the character encoding -->
  <meta charset="UTF-8">

  <!-- Helps the webpage display correctly on different screen sizes -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Sets the title shown in the browser tab -->
  <title>Study Buddy</title>

  <!-- Connects the CSS file -->
  <link rel="stylesheet" href="style.css">

  <!-- Connects the JavaScript file -->
  <script src="script.js" defer></script>
</head>

<body>
  <!-- Main container to keep content centered on the page -->
  <div class="app-container">

    <!-- Application Header -->
    <header class="app-header">
      <!-- Main application title matching the PDF's lowercase style -->
      <h1>study buddy ☆</h1>
      <!-- Friendly subtitle explaining what the app helps Jordan do -->
      <p>break big assignments into small steps &amp; see what's due first</p>
    </header>

    <!-- Section for adding a new assignment -->
    <section class="form-card">
      <h2>add a new assignment</h2>

      <!-- Form to collect assignment details from Jordan -->
      <form id="assignmentForm">
        <!-- Input for assignment title -->
        <div class="form-group">
          <label for="taskName">assignment name</label>
          <input type="text" id="taskName" placeholder="e.g., study for math exam" required>
        </div>

        <!-- Row to group class name and due date side-by-side -->
        <div class="form-row">
          <div class="form-group">
            <label for="className">class</label>
            <input type="text" id="className" placeholder="e.g., math" required>
          </div>

          <div class="form-group">
            <label for="dueDate">due date</label>
            <input type="date" id="dueDate" required>
          </div>
        </div>

        <!-- Row to group max time and important checkbox -->
        <div class="form-row">
          <div class="form-group">
            <label for="maxTime">max time (minutes)</label>
            <input type="number" id="maxTime" placeholder="e.g., 45" min="5" required>
          </div>

          <div class="form-group checkbox-group">
            <label for="isImportant">
              <input type="checkbox" id="isImportant">
              mark as important ★
            </label>
          </div>
        </div>

        <!-- Button to submit the form -->
        <button type="submit" class="add-btn">+ add assignment</button>
      </form>
    </section>

  </div>
</body>
</html>
